# Déploiement production — tire les images depuis ghcr.io, aucun clone requis.
# L'init DB est automatique via le service db-init.
# Usage :
#   docker compose -f docker-compose.prod.yml up -d
#
# Architecture réseau :
#   frontend ── edr-server, site-web    (ports exposés)
#   backend  ── site-web, site-db       (interne, aucun port exposé)

services:

  # ── EDR Server (FastAPI) ──────────────────────────────────────────────────
  edr-server:
    image: ghcr.io/lockbits-esgi/edr:latest
    container_name: lockbits_edr
    pull_policy: always
    depends_on:
      edr-db:
        condition: service_healthy
    ports:
      - "${EDR_PORT:-8001}:8000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DATABASE_URL: ${EDR_DATABASE_URL:-postgresql+asyncpg://${EDR_DB_USER:-edr}:${EDR_DB_PASS:?EDR_DB_PASS is required}@edr-db/${EDR_DB_NAME:-edr}}
      AUTH_TOKEN: ${EDR_AUTH_TOKEN:?EDR_AUTH_TOKEN is required in production}
      VT_ENABLED: ${VT_ENABLED:-false}
      VT_API_KEY: ${VT_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - edr_data:/app/data
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ── EDR Database (PostgreSQL) ───────────────────────────────────────────
  edr-db:
    image: postgres:16-alpine
    container_name: lockbits_edr_db
    environment:
      POSTGRES_DB: ${EDR_DB_NAME:-edr}
      POSTGRES_USER: ${EDR_DB_USER:-edr}
      POSTGRES_PASSWORD: ${EDR_DB_PASS:?EDR_DB_PASS is required}
    volumes:
      - edr_db_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDR_DB_USER:-edr} -d ${EDR_DB_NAME:-edr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Initialisation automatique de la base de données ──────────────────────
  # S'exécute une fois au premier déploiement (idempotent).
  # Utilise l'image site_lockbits qui contient mysql CLI + database.sql.
  db-init:
    image: ghcr.io/lockbits-esgi/site_lockbits:latest
    container_name: lockbits_init
    pull_policy: always
    depends_on:
      site-db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-lockbits}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:-lockbits_client}
    entrypoint: >
      echo '>>> Waiting for database...' &&
      sleep 3 &&
      echo '>>> Initializing database schema...' &&
      mysql -h site-db --ssl-mode=DISABLED -u "$$DB_USER" -p"$$DB_PASS" "$$DB_NAME"
        < /var/www/html/client/database.sql &&
      echo '>>> Database initialized successfully'
    networks:
      - backend
    restart: "no"

  # ── LockBits Site (PHP/Apache) ────────────────────────────────────────────
  site-web:
    image: ghcr.io/lockbits-esgi/site_lockbits:latest
    container_name: lockbits_web
    pull_policy: always
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: site-db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-lockbits_client}
      DB_USER: ${DB_USER:-lockbits}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      APP_NAME: ${APP_NAME:-LockBits Client Area}
      APP_ENV: ${APP_ENV:-production}
      GLPI_API_URL: ${GLPI_API_URL:-}
      GLPI_WEB_URL: ${GLPI_WEB_URL:-}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_OAUTH_CLIENT_ID: ${GLPI_OAUTH_CLIENT_ID:-}
      GLPI_OAUTH_CLIENT_SECRET: ${GLPI_OAUTH_CLIENT_SECRET:-}
      GLPI_API_USERNAME: ${GLPI_API_USERNAME:-}
      GLPI_API_PASSWORD: ${GLPI_API_PASSWORD:-}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── MySQL (for the site) ──────────────────────────────────────────────────
  site-db:
    image: mysql:8.0
    container_name: lockbits_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-lockbits_client}
      MYSQL_USER: ${DB_USER:-lockbits}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS is required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ── Watchtower — Mise à jour automatique ──────────────────────────────
  # Utilise le fork maintenu de watchtower (containrrr/watchtower est archivé).
  # https://github.com/nicholas-fedor/watchtower
  watchtower:
    image: nickfedor/watchtower
    container_name: lockbits_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  edr_data:
    driver: local
  edr_db_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
