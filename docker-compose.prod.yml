# Déploiement production — tire les images depuis ghcr.io, aucun clone requis.
# MySQL est géré par un service Dokploy dédié (externe à ce compose).
# Usage :
#   docker compose -f docker-compose.prod.yml up -d
#
# Variables OBLIGATOIRES dans Dokploy :
#   DB_PASS, EDR_DB_PASS, EDR_AUTH_TOKEN
#   DB_HOST (hostname du MySQL Dokploy, ex: host.docker.internal)
#
# Ports par défaut (prod) :
#   site-web  → 8080   EDR  → 8001
#   Prometheus → 9092  Grafana → 3002
#   MySQL Dokploy externe → 3377 (à configurer dans le service Dokploy MySQL)
#
# Architecture réseau :
#   frontend ── edr-server, site-web    (ports exposés)
#   backend  ── edr-server, edr-db      (interne)

services:

  # ── EDR Server (FastAPI) ──────────────────────────────────────────────────
  edr-server:
    image: ghcr.io/lockbits-esgi/edr:latest
    container_name: lockbits_edr
    pull_policy: always
    depends_on:
      edr-db:
        condition: service_healthy
    ports:
      - "${EDR_PORT:-8001}:8000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DATABASE_URL: ${EDR_DATABASE_URL:-postgresql://${EDR_DB_USER:-edr}:${EDR_DB_PASS:?EDR_DB_PASS is required}@edr-db/${EDR_DB_NAME:-edr}}
      AUTH_TOKEN: ${EDR_AUTH_TOKEN:?EDR_AUTH_TOKEN is required in production}
      VT_ENABLED: ${VT_ENABLED:-false}
      VT_API_KEY: ${VT_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - edr_data:/app/data
    networks:
      - frontend
      - backend
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ── EDR Database (PostgreSQL) ───────────────────────────────────────────
  edr-db:
    image: postgres:16-alpine
    container_name: lockbits_edr_db
    environment:
      POSTGRES_DB: ${EDR_DB_NAME:-edr}
      POSTGRES_USER: ${EDR_DB_USER:-edr}
      POSTGRES_PASSWORD: ${EDR_DB_PASS:?EDR_DB_PASS is required}
    volumes:
      - edr_db_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDR_DB_USER:-edr} -d ${EDR_DB_NAME:-edr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── LockBits Site (PHP/Apache) ────────────────────────────────────────────
  # Le docker-entrypoint.sh attend MySQL (DB_HOST:DB_PORT) et initialise
  # le schéma automatiquement si les tables sont absentes.
  #
  # MySQL externe (service Dokploy) : exposé sur le port 3377 de l'hôte.
  # Dans Dokploy, configurer :
  #   MYSQL_DATABASE=lockbits_client
  #   MYSQL_USER=lockbits
  #   MYSQL_PASSWORD=<DB_PASS>
  site-web:
    image: ghcr.io/lockbits-esgi/site_lockbits:latest
    container_name: lockbits_web
    pull_policy: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3377}
      DB_NAME: ${DB_NAME:-lockbits_client}
      DB_USER: ${DB_USER:-lockbits}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      APP_NAME: ${APP_NAME:-LockBits Client Area}
      APP_ENV: ${APP_ENV:-production}
      GLPI_API_URL: ${GLPI_API_URL:-}
      GLPI_WEB_URL: ${GLPI_WEB_URL:-}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_OAUTH_CLIENT_ID: ${GLPI_OAUTH_CLIENT_ID:-}
      GLPI_OAUTH_CLIENT_SECRET: ${GLPI_OAUTH_CLIENT_SECRET:-}
      GLPI_API_USERNAME: ${GLPI_API_USERNAME:-}
      GLPI_API_PASSWORD: ${GLPI_API_PASSWORD:-}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Prometheus — Métriques ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: lockbits_prometheus
    pull_policy: always
    ports:
      - "${PROMETHEUS_PORT:-9092}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Grafana — Tableaux de bord ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: lockbits_grafana
    pull_policy: always
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required in production}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - frontend
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Loki — Agrégation de logs ───────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: lockbits_loki
    pull_policy: always
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -target=all
    volumes:
      - loki_data:/loki
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Alloy — Collecteur de logs Docker ───────────────────────────────────
  alloy:
    image: grafana/alloy:latest
    container_name: lockbits_alloy
    pull_policy: always
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:12345/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

volumes:
  edr_data:
    driver: local
  edr_db_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
