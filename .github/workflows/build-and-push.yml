name: CI — Test → Build → Push

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  ORG: lockbits-esgi
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Tests
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── EDR — Unit tests (pytest) ────────────────────────────────────────────
  test-edr-unit:
    name: "EDR · Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edr/requirements.txt

      - name: Install dependencies
        run: pip install -r edr/requirements.txt

      - name: Run pytest
        working-directory: edr
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"
          VT_ENABLED: "false"

  # ── EDR — Integration smoke tests ────────────────────────────────────────
  test-edr-integration:
    name: "EDR · Integration smoke"
    runs-on: ubuntu-latest
    needs: test-edr-unit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build EDR image
        run: docker build -t edr-smoke -f docker/edr/Dockerfile edr/

      - name: Start EDR container
        run: |
          docker run -d \
            --name edr-smoke \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./miniedr.db \
            -e VT_ENABLED=false \
            edr-smoke

      - name: Wait for EDR to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "EDR ready (attempt $i)"; break
            fi
            [ $i -eq 30 ] && { echo "Timeout"; docker logs edr-smoke; exit 1; }
            sleep 2
          done

      - name: Install requests
        run: pip install requests

      - name: Run smoke tests
        run: python tests/smoke_edr.py http://localhost:8000

      - name: Show logs on failure
        if: failure()
        run: docker logs edr-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f edr-smoke || true

  # ── Site — Smoke tests ────────────────────────────────────────────────────
  test-site-smoke:
    name: "Site · Smoke tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start MySQL
        run: |
          docker run -d \
            --name ci-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=lockbits_client \
            -e MYSQL_USER=lockbits \
            -e MYSQL_PASSWORD=lockbits_password \
            -p 3306:3306 \
            mysql:8.0

      - name: Build site image
        run: docker build -t site-smoke -f site_lockbits/Dockerfile site_lockbits/

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL ready (attempt $i)"; break
            fi
            [ $i -eq 30 ] && { echo "Timeout"; docker logs ci-mysql; exit 1; }
            sleep 2
          done

      - name: Load DB schema
        run: |
          docker exec -i ci-mysql \
            mysql -u lockbits -plockbits_password lockbits_client \
            < site_lockbits/client/database.sql

      - name: Create network and start site
        run: |
          docker network create ci-net
          docker network connect ci-net ci-mysql --alias db
          docker run -d \
            --name site-smoke \
            --network ci-net \
            -p 8080:80 \
            -e DB_HOST=db \
            -e DB_PORT=3306 \
            -e DB_NAME=lockbits_client \
            -e DB_USER=lockbits \
            -e DB_PASS=lockbits_password \
            -e APP_ENV=testing \
            site-smoke

      - name: Wait for site
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Site ready (attempt $i)"; break
            fi
            [ $i -eq 30 ] && { echo "Timeout"; docker logs site-smoke; exit 1; }
            sleep 2
          done

      - name: Install requests
        run: pip install requests

      - name: Run smoke tests
        run: python tests/smoke_site.py http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs site-smoke || true
          docker logs ci-mysql  || true

      - name: Cleanup
        if: always()
        run: docker rm -f site-smoke ci-mysql || true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Build (per-platform, parallel matrix)
#   Each job builds one platform and pushes by digest.
#   Only runs on push to main (not PRs).
# ─────────────────────────────────────────────────────────────────────────────

  build-edr:
    name: "EDR · Build ${{ matrix.platform }}"
    runs-on: ubuntu-latest
    needs: test-edr-integration
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./edr
          file: ./docker/edr/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.ORG }}/edr,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=edr-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=edr-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/edr
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/edr/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: edr-digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/edr/*
          if-no-files-found: error
          retention-days: 1

  build-site:
    name: "Site · Build ${{ matrix.platform }}"
    runs-on: ubuntu-latest
    needs: test-site-smoke
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR_PAT required: site_lockbits package is owned by the site_lockbits
      # repo, so GITHUB_TOKEN from main is denied. Add a PAT with write:packages
      # scope as secret GHCR_PAT on this repo, or go to the site_lockbits package
      # settings and grant the main repo write access.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./site_lockbits
          file: ./site_lockbits/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=site-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=site-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/site
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/site/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: site-digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/site/*
          if-no-files-found: error
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Merge multi-arch manifests + attest
# ─────────────────────────────────────────────────────────────────────────────

  publish-edr:
    name: "EDR · Publish manifest"
    runs-on: ubuntu-latest
    needs: build-edr
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/edr
          pattern: edr-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/edr
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest
        id: push
        working-directory: /tmp/digests/edr
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.ORG }}/edr@sha256:%s ' *)

      - name: Inspect manifest and capture digest
        id: inspect
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.ORG }}/edr:latest
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.ORG }}/edr:latest \
            | grep "^Digest:" | awk '{print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/edr
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  publish-site:
    name: "Site · Publish manifest"
    runs-on: ubuntu-latest
    needs: build-site
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/site
          pattern: site-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest
        id: push
        working-directory: /tmp/digests/site
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits@sha256:%s ' *)

      - name: Inspect manifest and capture digest
        id: inspect
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits:latest
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits:latest \
            | grep "^Digest:" | awk '{print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — Summary
# ─────────────────────────────────────────────────────────────────────────────

  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    needs: [publish-edr, publish-site]
    if: github.event_name != 'pull_request'
    steps:
      - name: Images published
        run: |
          echo "ghcr.io/${{ env.ORG }}/edr:latest"
          echo "ghcr.io/${{ env.ORG }}/site_lockbits:latest"
