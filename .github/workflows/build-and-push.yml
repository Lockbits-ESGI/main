name: CI — Test → Build → Push

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  REGISTRY: ghcr.io
  ORG: lockbits-esgi
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Tests
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  test-edr-unit:
    name: "EDR · Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edr/requirements.txt

      - name: Install dependencies
        run: pip install -r edr/requirements.txt

      - name: Run pytest
        working-directory: edr
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"
          VT_ENABLED: "false"

  test-edr-integration:
    name: "EDR · Integration smoke"
    runs-on: ubuntu-latest
    needs: test-edr-unit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build EDR image
        run: docker build -t edr-smoke -f docker/edr/Dockerfile edr/

      - name: Start EDR container
        run: |
          docker run -d \
            --name edr-smoke \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./miniedr.db \
            -e VT_ENABLED=false \
            edr-smoke

      - name: Wait for EDR to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && echo "EDR ready" && break
            [ $i -eq 30 ] && { docker logs edr-smoke; exit 1; }
            sleep 2
          done

      - name: Install requests
        run: pip install requests

      - name: Run smoke tests
        run: python tests/smoke_edr.py http://localhost:8000

      - name: Show logs on failure
        if: failure()
        run: docker logs edr-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f edr-smoke || true

  test-site-smoke:
    name: "Site · Smoke tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start MySQL
        run: |
          docker run -d \
            --name ci-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=lockbits_client \
            -e MYSQL_USER=lockbits \
            -e MYSQL_PASSWORD=lockbits_password \
            mysql:8.0

      - name: Build site image
        run: docker build -t site-smoke -f site_lockbits/Dockerfile site_lockbits/

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null && echo "MySQL ready" && break
            [ $i -eq 30 ] && { docker logs ci-mysql; exit 1; }
            sleep 2
          done

      - name: Load DB schema
        run: |
          docker exec -i ci-mysql \
            mysql -u lockbits -plockbits_password lockbits_client \
            < site_lockbits/client/database.sql

      - name: Start site container
        run: |
          docker network create ci-net
          docker network connect ci-net ci-mysql --alias db
          docker run -d \
            --name site-smoke \
            --network ci-net \
            -p 8080:80 \
            -e DB_HOST=db \
            -e DB_PORT=3306 \
            -e DB_NAME=lockbits_client \
            -e DB_USER=lockbits \
            -e DB_PASS=lockbits_password \
            -e APP_ENV=testing \
            site-smoke

      - name: Wait for site
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null && echo "Site ready" && break
            [ $i -eq 30 ] && { docker logs site-smoke; exit 1; }
            sleep 2
          done

      - name: Install requests
        run: pip install requests

      - name: Run smoke tests
        run: python tests/smoke_site.py http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs site-smoke || true
          docker logs ci-mysql  || true

      - name: Cleanup
        if: always()
        run: docker rm -f site-smoke ci-mysql || true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Build & Push  (push to main only)
# ─────────────────────────────────────────────────────────────────────────────

  build-edr:
    name: "EDR · Build & Push"
    runs-on: ubuntu-latest
    needs: test-edr-integration
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/edr
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./edr
          file: ./docker/edr/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha,scope=edr
          cache-to: type=gha,mode=max,scope=edr

  build-site:
    name: "Site · Build & Push"
    runs-on: ubuntu-latest
    needs: test-site-smoke
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./site_lockbits
          file: ./site_lockbits/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Security Scans
# ─────────────────────────────────────────────────────────────────────────────

  trivy-scan:
    name: "🔍 Trivy · Docker image scan"
    runs-on: ubuntu-latest
    needs: [build-edr, build-site]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan EDR image (CRITICAL+HIGH → fail)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/edr:latest
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          vuln-type: os,library
          hide-progress: false

      - name: Scan site image (CRITICAL+HIGH → fail)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits:latest
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          vuln-type: os,library
          hide-progress: false
