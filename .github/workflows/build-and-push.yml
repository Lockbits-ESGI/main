name: CI — Test → Build → Push

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  REGISTRY: ghcr.io
  ORG: lockbits-esgi
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 0 — Lint & Format
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  lint-edr:
    name: "EDR · Ruff lint + format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        working-directory: edr
        run: ruff check --output-format=github

      - name: Ruff format check
        working-directory: edr
        run: ruff format --check

  test-edr-unit:
    name: "EDR · Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edr/requirements.txt

      - name: Install dependencies
        run: pip install -r edr/requirements.txt

      - name: Run pytest
        working-directory: edr
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"
          VT_ENABLED: "false"

  test-edr-integration:
    name: "EDR · Integration smoke"
    runs-on: ubuntu-latest
    needs: test-edr-unit
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build EDR image
        run: docker build -t edr-smoke -f docker/edr/Dockerfile edr/

      - name: Start EDR container
        run: |
          docker run -d \
            --name edr-smoke \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./miniedr.db \
            -e VT_ENABLED=false \
            edr-smoke

      - name: Wait for EDR to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && echo "EDR ready" && break
            [ $i -eq 30 ] && { docker logs edr-smoke; exit 1; }
            sleep 2
          done

      - name: Install requests
        run: pip install requests

      - name: Run smoke tests
        run: python tests/smoke_edr.py http://localhost:8000

      - name: Show logs on failure
        if: failure()
        run: docker logs edr-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f edr-smoke || true

  test-site-smoke:
    name: "Site · Smoke tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Start MySQL
        run: |
          docker run -d \
            --name ci-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=lockbits_client \
            -e MYSQL_USER=lockbits \
            -e MYSQL_PASSWORD=lockbits_password \
            mysql:8.0

      - name: Build site image
        run: docker build -t site-smoke -f site_lockbits/Dockerfile site_lockbits/

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            docker exec ci-mysql mysqladmin ping -h localhost --silent 2>/dev/null && echo "MySQL ready" && break
            [ $i -eq 30 ] && { docker logs ci-mysql; exit 1; }
            sleep 2
          done

      - name: Load DB schema
        run: |
          docker exec -i ci-mysql \
            mysql -u lockbits -plockbits_password lockbits_client \
            < site_lockbits/client/database.sql

      - name: Start site container
        run: |
          docker network create ci-net
          docker network connect ci-net ci-mysql --alias db
          docker run -d \
            --name site-smoke \
            --network ci-net \
            -p 8080:80 \
            -e DB_HOST=db \
            -e DB_PORT=3306 \
            -e DB_NAME=lockbits_client \
            -e DB_USER=lockbits \
            -e DB_PASS=lockbits_password \
            -e APP_ENV=testing \
            site-smoke

      - name: Wait for site
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null && echo "Site ready" && break
            [ $i -eq 30 ] && { docker logs site-smoke; exit 1; }
            sleep 2
          done

      - name: Install requests
        run: pip install requests

      - name: Run smoke tests
        run: python tests/smoke_site.py http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs site-smoke || true
          docker logs ci-mysql  || true

      - name: Cleanup
        if: always()
        run: docker rm -f site-smoke ci-mysql || true

  test-site-phpunit:
    name: PHPUnit (Site)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site_lockbits
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPUnit
        run: vendor/bin/phpunit

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Build & Push  (push to main only)
# ─────────────────────────────────────────────────────────────────────────────

  build-edr-agent-binary:
    name: "Agent · Binary (${{ matrix.arch }})"
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: test-edr-unit
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edr/requirements.txt

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r edr/requirements.txt

      - name: Build binary with PyInstaller
        run: |
          cd edr
          bash packaging/build_agent.sh --target linux --arch ${{ matrix.arch }} --dist dist
          echo "binary_path=edr/dist/lockbits-agent-linux-${{ matrix.arch }}/lockbits-agent" >> "$GITHUB_ENV"

      - name: Smoke test — scan mode
        run: |
          ${{ env.binary_path }} --mode scan || \
            echo "[WARN] Scan smoke test exited non-zero (expected if no server)"

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: edr/dist/lockbits-agent-linux-${{ matrix.arch }}/lockbits-agent
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: false

      - name: Upload artifact (for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: lockbits-agent-linux-${{ matrix.arch }}
          path: edr/dist/lockbits-agent-linux-${{ matrix.arch }}/lockbits-agent
          retention-days: 30

  release-agent:
    name: "Agent · Continuous Release"
    runs-on: ubuntu-latest
    needs: build-edr-agent-binary
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: lockbits-agent-linux-amd64
          path: ./release-assets/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: lockbits-agent-linux-arm64
          path: ./release-assets/arm64

      - name: Rename assets with architecture suffix
        run: |
          mv ./release-assets/amd64/lockbits-agent ./release-assets/lockbits-agent-linux-amd64
          mv ./release-assets/arm64/lockbits-agent ./release-assets/lockbits-agent-linux-arm64
          ls -la ./release-assets/

      - name: Create or update continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create release if it doesn't exist (no-op if it does)
          gh release create latest --title "Latest build" --notes "Automatic build from main branch" || true
          # Upload/overwrite assets
          gh release upload latest ./release-assets/lockbits-agent-linux-* --clobber

  build-edr-agent-docker:
    name: "Agent · Docker Build & Push"
    runs-on: ubuntu-latest
    needs: test-edr-unit
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/edr-agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ./edr
          file: ./docker/edr-agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha,scope=edr-agent
          cache-to: type=gha,mode=max,scope=edr-agent

  build-edr:
    name: "EDR · Build & Push"
    runs-on: ubuntu-latest
    needs: test-edr-integration
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/edr
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ./edr
          file: ./docker/edr/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha,scope=edr
          cache-to: type=gha,mode=max,scope=edr

  build-site:
    name: "Site · Build & Push"
    runs-on: ubuntu-latest
    needs: test-site-smoke
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ./site_lockbits
          file: ./site_lockbits/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Security Scans
# ─────────────────────────────────────────────────────────────────────────────

  trivy-scan:
    name: "🔍 Trivy · Docker image scan"
    runs-on: ubuntu-latest
    needs: [build-edr, build-site, build-edr-agent-docker]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan EDR image (CRITICAL+HIGH → report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/edr:latest
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          vuln-type: os,library
          hide-progress: false

      - name: Scan site image (CRITICAL+HIGH → report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/site_lockbits:latest
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          vuln-type: os,library
          hide-progress: false

      - uses: docker/metadata-action@v6
        id: meta-edr-agent
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/edr-agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve EDR agent image ref for scanning
        id: resolve-edr-agent-tag
        run: |
          FIRST_TAG=$(echo "${{ steps.meta-edr-agent.outputs.tags }}" | head -1)
          echo "image_ref=${FIRST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Scan EDR agent image (CRITICAL+HIGH → report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.resolve-edr-agent-tag.outputs.image_ref }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          vuln-type: os,library
          hide-progress: false

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 4 — Deploy to Dokploy (after images pushed to GHCR)
  # ─────────────────────────────────────────────────────────────────────────────

  deploy:
    name: "🚀 Dokploy · Déploiement"
    runs-on: ubuntu-latest
    needs: [build-edr, build-site]
    if: github.event_name != 'pull_request'
    steps:
      - name: Trigger production deployment
        if: github.ref_name == 'main'
        run: |
          echo "Triggering production deploy..."
          HTTP_CODE=$(curl -X POST \
            -A "Mozilla/5.0 (compatible; GitHub-Actions)" \
            -f -s -o /dev/null -w "%{http_code}" \
            --retry 3 \
            "${{ secrets.DOKPLOY_PROD_HOOK }}")
          echo "HTTP status: $HTTP_CODE"

      - name: Trigger preproduction deployment
        if: github.ref_name == 'develop'
        run: |
          echo "Triggering preproduction deploy..."
          HTTP_CODE=$(curl -X POST \
            -A "Mozilla/5.0 (compatible; GitHub-Actions)" \
            -f -s -o /dev/null -w "%{http_code}" \
            --retry 3 \
            "${{ secrets.DOKPLOY_PREPROD_HOOK }}")
          echo "HTTP status: $HTTP_CODE"
