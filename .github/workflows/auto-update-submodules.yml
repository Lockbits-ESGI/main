name: Auto-update submodules

on:
  repository_dispatch:
    types: [submodule-updated]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update submodules
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          ref: develop
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules to latest remote
        run: |
          # --merge causes "unrelated histories" on shallow CI clones
          # --remote + fetch more history avoids the error
          git fetch --deepen=100 origin 2>/dev/null || true
          git submodule update --remote

      - name: Check if anything changed
        id: diff
        run: |
          if git diff --quiet --exit-code; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Submodules have new commits:"
            git diff --submodule
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "LockBits Bot"
          git config user.email "bot@lockbits-esgi"
          git add -u
          git commit -m "chore: auto-update submodules"
          git push origin develop
