# Déploiement preprod — tire les images depuis ghcr.io avec le tag :develop.
# Usage :
#   docker compose -f docker-compose.preprod.yml up -d
#
# Architecture réseau :
#   frontend ── edr-server, site-web    (ports exposés)
#   backend  ── site-web, site-db       (interne, aucun port exposé)

services:

  # ── EDR Server (FastAPI) ──────────────────────────────────────────────────
  edr-server:
    image: ghcr.io/lockbits-esgi/edr:develop
    container_name: lockbits_edr_preprod
    pull_policy: always
    depends_on:
      edr-db:
        condition: service_healthy
    ports:
      - "${EDR_PORT:-8001}:8000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DATABASE_URL: ${EDR_DATABASE_URL:-postgresql+asyncpg://${EDR_DB_USER:-edr}:${EDR_DB_PASS:?EDR_DB_PASS is required}@edr-db/${EDR_DB_NAME:-edr}}
      AUTH_TOKEN: ${EDR_AUTH_TOKEN:?EDR_AUTH_TOKEN is required in production}
      VT_ENABLED: ${VT_ENABLED:-false}
      VT_API_KEY: ${VT_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - edr_data_preprod:/app/data
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ── EDR Database (PostgreSQL) ───────────────────────────────────────────
  edr-db:
    image: postgres:16-alpine
    container_name: lockbits_edr_db_preprod
    environment:
      POSTGRES_DB: ${EDR_DB_NAME:-edr}
      POSTGRES_USER: ${EDR_DB_USER:-edr}
      POSTGRES_PASSWORD: ${EDR_DB_PASS:?EDR_DB_PASS is required}
    volumes:
      - edr_db_data_preprod:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDR_DB_USER:-edr} -d ${EDR_DB_NAME:-edr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Initialisation automatique de la base de données ──────────────────────
  db-init:
    image: ghcr.io/lockbits-esgi/site_lockbits:develop
    container_name: lockbits_init_preprod
    pull_policy: always
    depends_on:
      site-db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-lockbits}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:-lockbits_client}
    entrypoint: >
      echo '>>> Waiting for database...' &&
      sleep 3 &&
      echo '>>> Initializing database schema...' &&
      mysql -h site-db --ssl-mode=DISABLED -u "$$DB_USER" -p"$$DB_PASS" "$$DB_NAME"
        < /var/www/html/client/database.sql &&
      echo '>>> Database initialized successfully'
    networks:
      - backend
    restart: "no"

  # ── LockBits Site (PHP/Apache) ────────────────────────────────────────────
  site-web:
    image: ghcr.io/lockbits-esgi/site_lockbits:develop
    container_name: lockbits_web_preprod
    pull_policy: always
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: site-db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-lockbits_client}
      DB_USER: ${DB_USER:-lockbits}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      APP_NAME: ${APP_NAME:-LockBits Client Area (Preprod)}
      APP_ENV: ${APP_ENV:-staging}
      GLPI_API_URL: ${GLPI_API_URL:-}
      GLPI_WEB_URL: ${GLPI_WEB_URL:-}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_OAUTH_CLIENT_ID: ${GLPI_OAUTH_CLIENT_ID:-}
      GLPI_OAUTH_CLIENT_SECRET: ${GLPI_OAUTH_CLIENT_SECRET:-}
      GLPI_API_USERNAME: ${GLPI_API_USERNAME:-}
      GLPI_API_PASSWORD: ${GLPI_API_PASSWORD:-}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── MySQL (for the site) ──────────────────────────────────────────────────
  site-db:
    image: mysql:8.0
    container_name: lockbits_db_preprod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-lockbits_client}
      MYSQL_USER: ${DB_USER:-lockbits}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS is required}
    volumes:
      - mysql_data_preprod:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ── Prometheus — Métriques ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: lockbits_prometheus_preprod
    pull_policy: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - prometheus_data_preprod:/prometheus
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Grafana — Tableaux de bord ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: lockbits_grafana_preprod
    pull_policy: always
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DATASOURCES_PROMETHEUS_TYPE: prometheus
      GF_DATASOURCES_PROMETHEUS_URL: http://prometheus:9090
      GF_DATASOURCES_PROMETHEUS_ACCESS: proxy
      GF_DATASOURCES_PROMETHEUS_ISDEFAULT: "true"
      GF_DATASOURCES_LOKI_TYPE: loki
      GF_DATASOURCES_LOKI_URL: http://loki:3100
      GF_DATASOURCES_LOKI_ACCESS: proxy
    volumes:
      - grafana_data_preprod:/var/lib/grafana
    networks:
      - frontend
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Loki — Agrégation de logs ───────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: lockbits_loki_preprod
    pull_policy: always
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -target=all
    volumes:
      - loki_data_preprod:/loki
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Alloy — Collecteur de logs Docker ───────────────────────────────────
  alloy:
    image: grafana/alloy:latest
    container_name: lockbits_alloy_preprod
    pull_policy: always
    entrypoint:
      - sh
      - -c
      - |
        printf 'loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }
        local.file_match "docker" {
          path_targets = ["/var/lib/docker/containers/*/*-json.log"]
        }
        loki.source.file "docker" {
          targets    = local.file_match.docker.targets
          forward_to = [loki.write.default.receiver]
        }
        ' > /etc/alloy/config.alloy
        alloy run /etc/alloy/config.alloy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:12345/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

volumes:
  mysql_data_preprod:
    driver: local
  edr_data_preprod:
    driver: local
  edr_db_data_preprod:
    driver: local
  prometheus_data_preprod:
    driver: local
  grafana_data_preprod:
    driver: local
  loki_data_preprod:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
