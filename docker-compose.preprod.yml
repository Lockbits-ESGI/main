# Déploiement preprod — tire les images depuis ghcr.io avec le tag :develop.
# MySQL est géré par un service Dokploy dédié (externe à ce compose).
# Usage :
#   docker compose -f docker-compose.preprod.yml up -d
#
# Variables OBLIGATOIRES dans Dokploy :
#   DB_PASS
#   DB_HOST (hostname du MySQL Dokploy, ex: host.docker.internal)
#
# Ports par défaut (preprod) :
#   site-web  → 8080   EDR  → 8001
#   Prometheus → 9090  Grafana → 3001
#   MySQL Dokploy externe → 3366 (à configurer dans le service Dokploy MySQL)
#
# Architecture réseau :
#   frontend ── edr-server, site-web    (ports exposés)
#   backend  ── edr-server, edr-db      (interne)

services:

  # ── EDR Server (FastAPI) ──────────────────────────────────────────────────
  edr-server:
    image: ghcr.io/lockbits-esgi/edr:develop
    container_name: lockbits_edr_preprod
    pull_policy: always
    depends_on:
      edr-db:
        condition: service_healthy
    ports:
      - "${EDR_PORT:-8001}:8000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DATABASE_URL: ${EDR_DATABASE_URL:-postgresql+asyncpg://${EDR_DB_USER:-edr}:${EDR_DB_PASS:-edr_preprod}@edr-db/${EDR_DB_NAME:-edr}}
      AUTH_TOKEN: ${EDR_AUTH_TOKEN:-}
      VT_ENABLED: ${VT_ENABLED:-false}
      VT_API_KEY: ${VT_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - edr_data_preprod:/app/data
    networks:
      - frontend
      - backend
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ── EDR Database (PostgreSQL) ───────────────────────────────────────────
  edr-db:
    image: postgres:16-alpine
    container_name: lockbits_edr_db_preprod
    environment:
      POSTGRES_DB: ${EDR_DB_NAME:-edr}
      POSTGRES_USER: ${EDR_DB_USER:-edr}
      POSTGRES_PASSWORD: ${EDR_DB_PASS:-edr_preprod}
    volumes:
      - edr_db_data_preprod:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDR_DB_USER:-edr} -d ${EDR_DB_NAME:-edr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── LockBits Site (PHP/Apache) ────────────────────────────────────────────
  # Le docker-entrypoint.sh attend MySQL (DB_HOST:DB_PORT) et initialise
  # le schéma automatiquement si les tables sont absentes.
  #
  # MySQL externe (service Dokploy) : exposé sur le port 3366 de l'hôte.
  # Dans Dokploy, configurer :
  #   MYSQL_DATABASE=lockbits_client
  #   MYSQL_USER=lockbits
  #   MYSQL_PASSWORD=<DB_PASS>
  site-web:
    image: ghcr.io/lockbits-esgi/site_lockbits:develop
    container_name: lockbits_web_preprod
    pull_policy: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3366}
      DB_NAME: ${DB_NAME:-lockbits_client}
      DB_USER: ${DB_USER:-lockbits}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      APP_NAME: ${APP_NAME:-LockBits Client Area (Preprod)}
      APP_ENV: ${APP_ENV:-staging}
      GLPI_API_URL: ${GLPI_API_URL:-}
      GLPI_WEB_URL: ${GLPI_WEB_URL:-}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_OAUTH_CLIENT_ID: ${GLPI_OAUTH_CLIENT_ID:-}
      GLPI_OAUTH_CLIENT_SECRET: ${GLPI_OAUTH_CLIENT_SECRET:-}
      GLPI_API_USERNAME: ${GLPI_API_USERNAME:-}
      GLPI_API_PASSWORD: ${GLPI_API_PASSWORD:-}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Prometheus — Métriques ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: lockbits_prometheus_preprod
    pull_policy: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    entrypoint:
      - sh
      - -c
      - |
        cat > /prometheus/prometheus.yml << 'PROMEOF'
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: "lockbits_edr"
            metrics_path: "/metrics"
            static_configs:
              - targets: ["edr-server:8000"]
          - job_name: "prometheus"
            static_configs:
              - targets: ["localhost:9090"]
        PROMEOF
        exec prometheus --config.file=/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.console.libraries=/etc/prometheus/console_libraries --web.console.templates=/etc/prometheus/consoles --web.enable-lifecycle
    volumes:
      - prometheus_data_preprod:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Grafana — Tableaux de bord ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: lockbits_grafana_preprod
    pull_policy: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DATASOURCES_PROMETHEUS_TYPE: prometheus
      GF_DATASOURCES_PROMETHEUS_URL: http://prometheus:9090
      GF_DATASOURCES_PROMETHEUS_ACCESS: proxy
      GF_DATASOURCES_PROMETHEUS_ISDEFAULT: "true"
      GF_DATASOURCES_LOKI_TYPE: loki
      GF_DATASOURCES_LOKI_URL: http://loki:3100
      GF_DATASOURCES_LOKI_ACCESS: proxy
    volumes:
      - grafana_data_preprod:/var/lib/grafana
    networks:
      - frontend
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Loki — Agrégation de logs ───────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: lockbits_loki_preprod
    pull_policy: always
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -target=all
    volumes:
      - loki_data_preprod:/loki
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Alloy — Collecteur de logs Docker ───────────────────────────────────
  alloy:
    image: grafana/alloy:latest
    container_name: lockbits_alloy_preprod
    pull_policy: always
    entrypoint:
      - sh
      - -c
      - |
        printf 'loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }
        local.file_match "docker" {
          path_targets = [{
            __address__ = "localhost",
            path        = "/var/lib/docker/containers/*/*-json.log",
          }]
        }
        loki.source.file "docker" {
          targets    = local.file_match.docker.targets
          forward_to = [loki.write.default.receiver]
        }
        ' > /etc/alloy/config.alloy
        alloy run /etc/alloy/config.alloy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:12345/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

volumes:
  edr_data_preprod:
    driver: local
  edr_db_data_preprod:
    driver: local
  prometheus_data_preprod:
    driver: local
  grafana_data_preprod:
    driver: local
  loki_data_preprod:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
