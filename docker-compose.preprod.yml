# Déploiement preprod — tire les images depuis ghcr.io avec le tag :develop.
# Usage :
#   docker compose -f docker-compose.preprod.yml up -d
#
# Architecture réseau :
#   frontend ── edr-server, site-web    (ports exposés)
#   backend  ── site-web, site-db       (interne, aucun port exposé)

services:

  # ── EDR Server (FastAPI) ──────────────────────────────────────────────────
  edr-server:
    image: ghcr.io/lockbits-esgi/edr:develop
    container_name: lockbits_edr_preprod
    pull_policy: always
    ports:
      - "${EDR_PORT:-8001}:8000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DATABASE_URL: ${EDR_DATABASE_URL:-sqlite:///./miniedr.db}
      AUTH_TOKEN: ${EDR_AUTH_TOKEN:-}
      VT_ENABLED: ${VT_ENABLED:-false}
      VT_API_KEY: ${VT_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - edr_data_preprod:/app/data
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Initialisation automatique de la base de données ──────────────────────
  db-init:
    image: ghcr.io/lockbits-esgi/site_lockbits:develop
    container_name: lockbits_init_preprod
    pull_policy: always
    depends_on:
      site-db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-lockbits}
      DB_PASS: ${DB_PASS:-lockbits_password}
      DB_NAME: ${DB_NAME:-lockbits_client}
    entrypoint: >
      echo '>>> Waiting for database...' &&
      sleep 3 &&
      echo '>>> Initializing database schema...' &&
      mysql -h site-db --ssl-mode=DISABLED -u "$$DB_USER" -p"$$DB_PASS" "$$DB_NAME"
        < /var/www/html/client/database.sql &&
      echo '>>> Database initialized successfully'
    networks:
      - backend
    restart: "no"

  # ── LockBits Site (PHP/Apache) ────────────────────────────────────────────
  site-web:
    image: ghcr.io/lockbits-esgi/site_lockbits:develop
    container_name: lockbits_web_preprod
    pull_policy: always
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: site-db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-lockbits_client}
      DB_USER: ${DB_USER:-lockbits}
      DB_PASS: ${DB_PASS:-lockbits_password}
      APP_NAME: ${APP_NAME:-LockBits Client Area (Preprod)}
      APP_ENV: ${APP_ENV:-staging}
      GLPI_API_URL: ${GLPI_API_URL:-}
      GLPI_WEB_URL: ${GLPI_WEB_URL:-}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_OAUTH_CLIENT_ID: ${GLPI_OAUTH_CLIENT_ID:-}
      GLPI_OAUTH_CLIENT_SECRET: ${GLPI_OAUTH_CLIENT_SECRET:-}
      GLPI_API_USERNAME: ${GLPI_API_USERNAME:-}
      GLPI_API_PASSWORD: ${GLPI_API_PASSWORD:-}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── MySQL (for the site) ──────────────────────────────────────────────────
  site-db:
    image: mysql:8.0
    container_name: lockbits_db_preprod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-lockbits_client}
      MYSQL_USER: ${DB_USER:-lockbits}
      MYSQL_PASSWORD: ${DB_PASS:-lockbits_password}
    volumes:
      - mysql_data_preprod:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Watchtower — Mise à jour automatique ──────────────────────────────
  watchtower:
    image: containrrr/watchtower
    container_name: lockbits_watchtower_preprod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    restart: unless-stopped

volumes:
  mysql_data_preprod:
    driver: local
  edr_data_preprod:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
